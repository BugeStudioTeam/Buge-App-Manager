name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'AppManager*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: bash scripts/version.sh app/build.gradle.kts

      - name: Check changelog
        run: |
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          test -s "$CHANGELOG" || { echo "ERROR: changelog missing or empty: $CHANGELOG" >&2; exit 1; }
          head -5 "$CHANGELOG"

      - name: Check tag is free
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/${{ steps.version.outputs.tag }}")
          test "$CODE" = "404" || { echo "ERROR: tag already exists: ${{ steps.version.outputs.tag }} ($CODE)" >&2; exit 1; }

      - name: Check signing secrets
        run: |
          test -n "${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}" || { echo "ERROR: KEYSTORE_PROPERTIES_BASE64 is not set" >&2; exit 1; }
          test -n "${{ secrets.KEYSTORE_JKS_BASE64 }}" || { echo "ERROR: KEYSTORE_JKS_BASE64 is not set" >&2; exit 1; }

  build:
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode signing files
        run: |
          echo "${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}" | base64 -d > keystore.properties
          echo "${{ secrets.KEYSTORE_JKS_BASE64 }}" | base64 -d > app/keystore.jks
          chmod 600 keystore.properties app/keystore.jks

      - name: Build release
        id: build
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          bash scripts/release.sh
          echo "apk_path=dist/BugeAppManager-v${{ needs.preflight.outputs.version_name }}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Buge App Manager ${{ needs.preflight.outputs.version_name }}
          body_path: fastlane/metadata/android/en-US/changelogs/${{ needs.preflight.outputs.version_code }}.txt
          files: ${{ steps.build.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    needs: [ preflight, build ]
    if: always()
    steps:
      - name: Check build result
        run: |
          test "${{ needs.build.result }}" = "success" || { echo "ERROR: build failed: ${{ needs.build.result }}" >&2; exit 1; }

      - name: Check release asset
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          ASSET="BugeAppManager-v${{ needs.preflight.outputs.version_name }}-release.apk"
          for i in 1 2 3 4 5; do
            NAMES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" \
              | grep -oP '"name":\s*"\K[^"]+')
            echo "attempt $i: $NAMES"
            if echo "$NAMES" | grep -qxF "$ASSET"; then
              echo "release asset found: $ASSET"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: release asset missing: $ASSET" >&2
          exit 1
