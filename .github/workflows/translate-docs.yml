name: Translate docs

on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'Comma separated language codes (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: translate-docs
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      TRANSLATE_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify API key
        run: |
          if [ -z "$TRANSLATE_API_KEY" ]; then
            echo "DEEPL_API_KEY secret is not set" >&2
            exit 1
          fi

      - name: Translate
        env:
          LANGS: ${{ inputs.langs }}
        run: |
          if [ -n "$LANGS" ]; then
            python scripts/translate_readme.py --langs "$LANGS"
          else
            python scripts/translate_readme.py
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no translation changes"
            exit 0
          fi
          git commit -m "docs: refresh translations"
          git push