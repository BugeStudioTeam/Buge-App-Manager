name: Security & Malware Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav ca-certificates
          sudo systemctl stop clamav-freshclam || true

      - name: Update ClamAV database
        run: |
          sudo freshclam || {
            echo "::warning::freshclam failed, checking existing database"
            ls -la /var/lib/clamav/ || true
            exit 1
          }

      - name: Scan repository with ClamAV
        run: |
          clamscan -r --infected --no-summary . || {
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "::error::ClamAV found infected files"
            else
              echo "::error::ClamAV scan failed with exit code $EXIT_CODE"
            fi
            exit 1
          }

      - name: Install pipx
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath

      - name: Scan for malicious code patterns
        run: |
          pipx install devguard-scanner
          devguard scan . --fail-on high || {
            echo "::error::DevGuard found high-severity malicious indicators"
            exit 1
          }

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version

      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --scanners vuln,secret,misconfig

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
