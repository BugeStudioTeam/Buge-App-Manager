name: Build and Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'AppManager*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version from build.gradle.kts
        id: version
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: $GRADLE_FILE not found"
            exit 1
          fi

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE_FILE" | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$GRADLE_FILE" | head -1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Failed to detect versionName or versionCode"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=AppManager$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Detected: versionName=$VERSION_NAME versionCode=$VERSION_CODE tag=AppManager$VERSION_NAME"

      - name: Verify changelog exists
        run: |
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          FILE="fastlane/android/metadata/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Changelog not found: $FILE"
            exit 1
          fi
          if [ ! -s "$FILE" ]; then
            echo "ERROR: Changelog is empty: $FILE"
            exit 1
          fi
          echo "Changelog found: $FILE"
          head -5 "$FILE"

      - name: Verify no duplicate tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$TAG")
          if [ "$RESPONSE" = "200" ]; then
            echo "ERROR: Tag already exists: $TAG"
            exit 1
          fi
          echo "Tag is available: $TAG"

      - name: Verify keystore secrets are set
        run: |
          if [ -z "${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_PROPERTIES_BASE64 secret is missing"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_JKS_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_JKS_BASE64 secret is missing"
            exit 1
          fi
          echo "Keystore secrets are set"

  build:
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      apk_path: ${{ steps.rename.outputs.apk_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}" | base64 -d > keystore.properties
          chmod 600 keystore.properties

      - name: Decode keystore.jks
        run: |
          echo "${{ secrets.KEYSTORE_JKS_BASE64 }}" | base64 -d > app/keystore.jks
          chmod 600 app/keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify build output exists
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found after build"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty: $APK"
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "Build succeeded: $APK ($SIZE)"

      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi
          if ! "$APKSIGNER" verify "$APK"; then
            echo "ERROR: APK signature verification failed"
            exit 1
          fi
          echo "APK signature verified"

      - name: Rename APK
        id: rename
        run: |
          VERSION_NAME="${{ needs.preflight.outputs.version_name }}"
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="BugeAppManager-v${VERSION_NAME}-release.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "Renamed APK: $DEST"

      - name: Read changelog
        run: |
          VERSION_CODE="${{ needs.preflight.outputs.version_code }}"
          FILE="fastlane/android/metadata/en-US/changelogs/${VERSION_CODE}.txt"
          cp "$FILE" release_body.txt
          echo "Loaded changelog from $FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: Buge App Manager ${{ needs.preflight.outputs.version_name }}
          body_path: release_body.txt
          files: ${{ steps.rename.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    needs: [ preflight, build ]
    if: always()
    steps:
      - name: Verify build result
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "ERROR: Build job failed: ${{ needs.build.result }}"
            exit 1
          fi
          echo "Build job succeeded"

      - name: Verify tag exists
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/$TAG")
          if [ "$RESPONSE" != "200" ]; then
            echo "ERROR: Tag not found on remote: $TAG (HTTP $RESPONSE)"
            exit 1
          fi
          echo "Tag exists: $TAG"

      - name: Verify release exists
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")
          if echo "$RELEASE" | grep -q '"message": "Not Found"'; then
            echo "ERROR: Release not found for tag: $TAG"
            exit 1
          fi
          RELEASE_NAME=$(echo "$RELEASE" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "Release exists: $RELEASE_NAME"

      - name: Verify release asset
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG/assets")
          EXPECTED="BugeAppManager-v${{ needs.preflight.outputs.version_name }}-release.apk"
          if ! echo "$ASSETS" | grep -q "$EXPECTED"; then
            echo "ERROR: APK asset not found in release: $EXPECTED"
            exit 1
          fi
          echo "Release asset found: $EXPECTED"

      - name: Summary
        run: |
          {
            echo "## Build and Release Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Version Name | ${{ needs.preflight.outputs.version_name }} |"
            echo "| Version Code | ${{ needs.preflight.outputs.version_code }} |"
            echo "| Tag | ${{ needs.preflight.outputs.tag }} |"
            echo "| APK | BugeAppManager-v${{ needs.preflight.outputs.version_name }}-release.apk |"
            echo "| Build Result | ${{ needs.build.result }} |"
          } >> $GITHUB_STEP_SUMMARY
